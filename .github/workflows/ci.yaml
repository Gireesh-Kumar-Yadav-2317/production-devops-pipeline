name: Employee Management CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}

jobs:
  test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      - name: Verify Java and Maven
        working-directory: app/springboot-app
        run: |
          java -version
          chmod +x mvnw
          ./mvnw --version

      - name: Download Dependencies
        working-directory: app/springboot-app
        run: |
          ./mvnw -B -ntp dependency:go-offline

      - name: Build and Test
        working-directory: app/springboot-app
        run: |
          ./mvnw -B -ntp clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/springboot-app/target/surefire-reports/
            app/springboot-app/target/failsafe-reports/
            app/springboot-app/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Application Jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-${{ github.sha }}
          path: |
            app/springboot-app/target/*.jar
            !app/springboot-app/target/*.original
          if-no-files-found: error
          retention-days: 14

  docker-security:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    env:
      LOCAL_IMAGE: employee-app:${{ github.sha }}
      TRIVY_VERSION: "0.76.1"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      - name: Prime Maven Cache
        working-directory: app/springboot-app
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp dependency:go-offline

      - name: Reject Committed Environment File
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env file must not be committed"
            exit 1
          fi

      - name: Create Trivy Cache
        run: mkdir -p "$HOME/.cache/trivy"

      # Debug mode: shows findings in logs
      - name: Scan Source Code
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:${TRIVY_VERSION} \
            fs \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            /work

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build \
            --pull \
            --load \
            --tag "$LOCAL_IMAGE" \
            --file docker/Dockerfile \
            .

      - name: Scan Docker Image
        run: |
          docker save "$LOCAL_IMAGE" \
            -o "$GITHUB_WORKSPACE/image.tar"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:${TRIVY_VERSION} \
            image \
            --input /work/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0

      - name: Generate Security Reports
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:${TRIVY_VERSION} \
            fs \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output /work/trivy-fs-results.json \
            --exit-code 0 \
            /work

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            trivy-fs-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Docker Hub Login
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image To DockerHub
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -z "$DOCKERHUB_USERNAME" ] || \
             [ -z "$DOCKERHUB_REPOSITORY" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_REPOSITORY are required"
            exit 1
          fi

          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:latest"
          docker push "$IMAGE:latest"