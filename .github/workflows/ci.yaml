name: Employee Management CI

on:
    push:
        branches:
            - main
            - 'feature/*'
    pull_request:
        branches:
            - main

permissions:
    contents: read



concurrency:
    group: employee-ci-${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    test:
        name: Build and Test Java Application
        runs-on: ubuntu-latest
        timeout-minutes: 15 

        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: '17'
                cache: maven 
            - name: Make maven wrapper executable
              working-directory: app/springboot-app
              run: chmod +x ./mvnw

            - name: Run tests and package application
              working-directory: app/springboot-app
              run: ./mvnw -B -ntp clean verify

    docker-build:
        name: Validate Docker Image Build
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 15

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

          
            - name: Build Docker image
              env:
                IMAGE_NAME: ${{ github.event.repository.name }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build \
                  --pull \
                  --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
                  --file docker/Dockerfile \
                    .

