name: Employee Management CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  TRIVY_VERSION: "0.76.1"

jobs:
  test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      - name: Build and Test
        working-directory: app/springboot-app
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/springboot-app/target/surefire-reports/
            app/springboot-app/target/failsafe-reports/
            app/springboot-app/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-${{ github.sha }}
          path: |
            app/springboot-app/target/*.jar
            !app/springboot-app/target/*.original
          if-no-files-found: error
          retention-days: 14

  docker-security:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    env:
      LOCAL_IMAGE: employee-app:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java and Maven Cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      # Warm the Maven cache for Trivy's Java dependency analysis.
      - name: Populate Maven Cache
        working-directory: app/springboot-app
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp dependency:go-offline

      - name: Reject Committed Environment File
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be committed."
            exit 1
          fi

      - name: Validate Docker Hub Configuration
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is missing."
            exit 1
          }

          test -n "$DOCKERHUB_REPOSITORY" || {
            echo "::error::DOCKERHUB_REPOSITORY is missing."
            exit 1
          }

          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is missing."
            exit 1
          }

      - name: Create Trivy Cache
        run: mkdir -p "$HOME/.cache/trivy"

      # Skip Java source metadata here to avoid Maven Central lookups.
      # Keep the built image scan for Java package vulnerabilities.
      - name: Scan Source for Secrets and Misconfigurations
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:${TRIVY_VERSION} \
            fs /work \
            --scanners secret,misconfig \
            --skip-dirs /work/app/springboot-app \
            --severity HIGH,CRITICAL \
            --format json \
            --output /work/trivy-fs-results.json \
            --exit-code 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build \
            --pull \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$LOCAL_IMAGE" \
            --file docker/Dockerfile \
            .

      - name: Scan Docker Image
        run: |
          docker save "$LOCAL_IMAGE" \
            -o "$GITHUB_WORKSPACE/image.tar"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:${TRIVY_VERSION} \
            image \
            --input /work/image.tar \
            --scanners vuln \
            --offline-scan \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-image-results.json \
            --exit-code 0

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            trivy-fs-results.json
            trivy-image-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnose Publishing Conditions
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Job status: ${{ job.status }}"

          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "Docker Hub username: configured"
          else
            echo "::warning::Docker Hub username is missing"
          fi

          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            echo "Docker Hub repository: configured"
          else
            echo "::warning::Docker Hub repository is missing"
          fi

      - name: Docker Hub Login
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:latest"
          docker push "$IMAGE:latest"

          echo "Published $IMAGE:${GITHUB_SHA}"
          echo "Published $IMAGE:latest"