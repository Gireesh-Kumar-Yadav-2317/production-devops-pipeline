name: Employee Management CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  APP_DIR: app/springboot-app
  TRIVY_VERSION: ${{ vars.TRIVY_VERSION || '0.76.1' }}

jobs:
  test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_DIR }}/pom.xml

      - name: Verify Java and Maven
        working-directory: ${{ env.APP_DIR }}
        run: |
          java -version
          chmod +x mvnw
          ./mvnw --version

      - name: Download Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          ./mvnw -B -ntp dependency:go-offline

      - name: Build Test Package
        working-directory: ${{ env.APP_DIR }}
        run: |
          ./mvnw -B -ntp clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            ${{ env.APP_DIR }}/target/surefire-reports/
            ${{ env.APP_DIR }}/target/failsafe-reports/
            ${{ env.APP_DIR }}/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-${{ github.sha }}
          path: |
            ${{ env.APP_DIR }}/target/*.jar
            !${{ env.APP_DIR }}/target/*.original
          if-no-files-found: error
          retention-days: 14

  docker-security:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    env:
      LOCAL_IMAGE: employee-app:${{ github.sha }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject Committed Environment File
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env file must not be committed"
            exit 1
          fi

      - name: Create Trivy Cache
        run: mkdir -p "$HOME/.cache/trivy"

      - name: Filesystem Security Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:${TRIVY_VERSION} \
            fs \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output /work/trivy-fs-results.json \
            --exit-code 1 \
            /work

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build \
            --pull \
            --load \
            --tag "$LOCAL_IMAGE" \
            --file docker/Dockerfile \
            .

      - name: Scan Docker Image
        run: |
          docker save "$LOCAL_IMAGE" \
            -o image.tar

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:${TRIVY_VERSION} \
            image \
            --input /work/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-image-results.json \
            --exit-code 1

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            trivy-fs-results.json
            trivy-image-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Login to Docker Hub
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -z "$DOCKERHUB_USERNAME" ] || \
             [ -z "$DOCKERHUB_REPOSITORY" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_REPOSITORY are required"
            exit 1
          fi

          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"

          docker tag "$LOCAL_IMAGE" "$IMAGE:latest"
          docker push "$IMAGE:latest"

          echo "Successfully pushed:"
          echo "$IMAGE:${GITHUB_SHA}"
          echo "$IMAGE:latest"