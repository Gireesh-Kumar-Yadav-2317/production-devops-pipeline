
name: Employee Management CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}

jobs:
  test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      - name: Verify Java and Maven
        working-directory: app/springboot-app
        run: |
          java -version
          chmod +x mvnw
          ./mvnw --version

      - name: Run all configured Maven checks
        working-directory: app/springboot-app
        run: ./mvnw -B -ntp clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/springboot-app/target/surefire-reports/
            app/springboot-app/target/failsafe-reports/
            app/springboot-app/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-${{ github.sha }}
          path: |
            app/springboot-app/target/*.jar
            !app/springboot-app/target/*.original
          if-no-files-found: error
          retention-days: 14

  docker-security:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    env:
      LOCAL_IMAGE: ci-image:${{ github.sha }}
      TRIVY_VERSION: "0.76.1"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject committed environment file
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be committed to Git."
            exit 1
          fi

      # Each GitHub Actions job has its own runner.
      # Restore the Maven cache in this job too.
      - name: Set up Java and restore Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/springboot-app/pom.xml

      # Populate ~/.m2/repository before Trivy examines pom.xml.
      - name: Resolve Maven dependencies
        working-directory: app/springboot-app
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp dependency:go-offline

      - name: Scan source and dependencies
        run: |
          mkdir -p "$HOME/.cache/trivy"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.m2/repository:/root/.m2/repository:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:${TRIVY_VERSION} \
            fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-fs-results.json \
            --exit-code 1 \
            /work

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --pull \
            --load \
            --tag "$LOCAL_IMAGE" \
            --file docker/Dockerfile \
            .

      - name: Scan Docker image for vulnerabilities
        run: |
          mkdir -p "$HOME/.cache/trivy"

          # Export the image so Trivy does not need the Docker socket.
          docker save "$LOCAL_IMAGE" -o "$GITHUB_WORKSPACE/image.tar"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:${TRIVY_VERSION} \
            image \
            --input /work/image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-image-results.json \
            --exit-code 1

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            trivy-fs-results.json
            trivy-image-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to Docker Hub
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image to Docker Hub
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -z "$DOCKERHUB_USERNAME" ] || \
             [ -z "$DOCKERHUB_REPOSITORY" ]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_REPOSITORY."
            exit 1
          fi

          DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"

          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_IMAGE:$GITHUB_SHA"

          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:latest"
